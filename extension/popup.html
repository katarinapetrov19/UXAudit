<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>UXCheck Audit</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap');

    :root {
      --bg: #F2F1ED;
      --card-bg: rgba(255,255,255,0.7);
      --card-border: rgba(0,0,0,0.08);
      --text: #0a0a0a;
      --text-muted: #737373;
      --critical: #dc2626;
      --major: #d97706;
      --minor: #ca8a04;
      --info: #2563eb;
      --primary: #0a0a0a;
      --primary-hover: #262626;
      --border: rgba(0,0,0,0.08);
    }

    body {
      width: 400px;
      margin: 0;
      padding: 0;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .header {
      background-color: rgba(242,241,237,0.85);
      backdrop-filter: blur(8px);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .container {
      padding: 16px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 10px 16px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 999px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      transition: background-color 0.15s;
      margin-bottom: 16px;
      box-sizing: border-box;
    }

    .button:hover {
      background-color: var(--primary-hover);
    }

    .button:disabled {
      background-color: #a3a3a3;
      cursor: not-allowed;
    }

    #results {
      max-height: 450px;
      overflow-y: auto;
    }

    .issue-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .issue-card:hover {
      background-color: #fff;
    }

    .issue-header {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }

    .severity-badge {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 2px 7px;
      border-radius: 999px;
      margin-right: 6px;
      color: white;
    }

    .severity-badge.Critical { background-color: var(--critical); }
    .severity-badge.Major { background-color: var(--major); }
    .severity-badge.Minor { background-color: var(--minor); }
    .severity-badge.Info { background-color: #6b7280; color: white; }

    .issue-type {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .issue-message {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .issue-details {
      display: none;
      font-size: 12px;
      border-top: 1px solid var(--border);
      padding-top: 8px;
      margin-top: 8px;
    }

    .issue-card.expanded .issue-details {
      display: block;
    }

    .detail-item {
      margin-bottom: 4px;
    }

    .detail-label {
      font-weight: 600;
      color: var(--text-muted);
    }

    .issue-selector {
      font-family: monospace;
      background: #f1f5f9;
      padding: 2px 4px;
      border-radius: 4px;
      color: #475569;
    }

    .show-on-page-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: #0a0a0a;
      color: white;
      border: none;
      border-radius: 999px;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .show-on-page-btn:hover { background: #333; }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .stat-item {
      text-align: center;
      padding: 8px 4px;
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--card-border);
    }

    .stat-value {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .stat-label {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .loader {
      display: none;
      text-align: center;
      margin-bottom: 16px;
    }

    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .filter-btn {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.12s;
    }

    .filter-btn:hover { color: var(--text); border-color: rgba(0,0,0,0.2); }
    .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
  </style>
</head>
<body>
  <div class="header">
    <h1>UXCheck</h1>
    <div id="version" style="font-size: 10px; color: var(--text-muted); letter-spacing: 0.02em;">v0.3.0</div>
  </div>
  
  <div class="container">
    <button id="runAudit" class="button">Scan Current Page</button>
    
    <div id="loader" class="loader">
      Scanning page...
    </div>

    <div id="stats" class="stats" style="display: none;">
      <div class="stat-item">
        <div id="critical-count" class="stat-value" style="color: var(--critical)">0</div>
        <div class="stat-label">Critical</div>
      </div>
      <div class="stat-item">
        <div id="major-count" class="stat-value" style="color: var(--major)">0</div>
        <div class="stat-label">Major</div>
      </div>
      <div class="stat-item">
        <div id="minor-count" class="stat-value" style="color: var(--minor)">0</div>
        <div class="stat-label">Minor</div>
      </div>
      <div class="stat-item">
        <div id="info-count" class="stat-value" style="color: #6b7280">0</div>
        <div class="stat-label">Info</div>
      </div>
    </div>

    <div id="export-actions" class="stats" style="display: none; grid-template-columns: 1fr 1fr;">
      <button id="exportPDF" class="button" style="margin-bottom: 0; background-color: var(--card-bg); color: var(--text); border: 1px solid var(--card-border);">Export PDF <span style="font-size: 8px; background: var(--primary); color: white; padding: 1px 5px; border-radius: 999px; vertical-align: middle; margin-left: 4px; font-weight: 600;">PRO</span></button>
      <button id="exportCSV" class="button" style="margin-bottom: 0; background-color: var(--card-bg); color: var(--text); border: 1px solid var(--card-border);">Export CSV <span style="font-size: 8px; background: var(--primary); color: white; padding: 1px 5px; border-radius: 999px; vertical-align: middle; margin-left: 4px; font-weight: 600;">PRO</span></button>
    </div>

    <div id="filters" class="filters" style="display:none;">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="accessibility">Accessibility</button>
      <button class="filter-btn" data-filter="typography">Typography</button>
      <button class="filter-btn" data-filter="layout">Layout</button>
      <button class="filter-btn" data-filter="ux">UX</button>
      <button class="filter-btn" data-filter="visual">Visual</button>
    </div>

    <div id="results">
      <div class="empty-state">
        Click the button above to start a UX audit on this page.
      </div>
    </div>
  </div>
  <script src="report.js"></script>
  <script src="popup.js"></script>
</body>
</html>
